name: Update COT Data

on:
  schedule:
    # COT data is released on Fridays at 3:30 PM ET.
    # 21:00 UTC (9:00 PM) is usually safe for the weekly update.
    - cron: '0 21 * * 5'
  workflow_dispatch: # Allows manual trigger from the Actions tab

concurrency:
  group: "workflow-data-update"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit and push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run build script
        # Whole-step retry for transient CFTC connection resets (see willco.py per-year retries).
        run: |
          set -e
          for attempt in 1 2 3; do
            if python build.py; then
              exit 0
            fi
            echo "build.py failed (attempt ${attempt}/3); waiting before retry..."
            sleep $((attempt * 30))
          done
          echo "build.py failed after 3 attempts"
          exit 1

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Auto-update COT data: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" && git push)
